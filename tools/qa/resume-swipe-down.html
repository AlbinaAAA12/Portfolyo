<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume downward swipe checks</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"></head><body>
<div id="root"></div><button id="run" style="position:fixed;bottom:0;right:0;z-index:9000">Run downward swipe checks</button><pre id="results" style="position:fixed;bottom:28px;right:0;z-index:9000;background:white;max-height:35vh;overflow:auto;font-size:10px"></pre>
<script type="module">
// Real TouchEvent sequences also cover native scrolling's pointercancel arbitration.
// A physical phone is still needed to assess the feel of the flick threshold.
import React from 'react';
import ReactDOM from 'react-dom/client';
import { PortfolioOverlays, Resume } from '/src/components/overlays/PortfolioOverlays.tsx';
import '/src/main.css';
const root=ReactDOM.createRoot(document.querySelector('#root'));
let kind=null,inline=false,closed=0;
const render=()=>root.render(React.createElement(React.Fragment,null,
 React.createElement('div',{className:'test-scroll',style:{height:'100dvh',overflowY:'auto'}},inline?React.createElement(Resume,{locale:'ru',showStickyClose:false,animateDismiss:true,close:()=>{closed++;inline=false;render();}}):null),
 React.createElement(PortfolioOverlays,{kind,locale:'ru',onClose:()=>{closed++;kind=null;render();}})));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const rows=[];
const check=(label,pass,data)=>{rows.push({label,pass:!!pass,data});document.querySelector('#results').textContent=JSON.stringify(rows,null,2);if(!pass)throw Error(label);};
async function open(asInline=false){kind=asInline?null:'resume';inline=asInline;render();await wait(480);return document.querySelector('.overlay-resume');}
async function gesture(target,{dx=0,dy=140,duration=120,cancel=false,multi=false,pointerCancel=false}={}){
 const rect=target.getBoundingClientRect();const x=Math.max(20,Math.min(innerWidth-20,rect.left+rect.width/2)),y=200;
 const touch=(identifier,clientX,clientY)=>new Touch({identifier,target,clientX,clientY});
 const start=touch(1,x,y);
 target.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,cancelable:true,touches:[start],changedTouches:[start]}));
 if(pointerCancel)target.dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:1,pointerType:'touch'}));
 if(multi)target.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,touches:[start,touch(2,x+20,y)],changedTouches:[touch(2,x+20,y)]}));
 await wait(duration);
 const end=touch(1,x+dx,y+dy);
 target.dispatchEvent(new TouchEvent('touchmove',{bubbles:true,touches:[end],changedTouches:[end]}));
 target.dispatchEvent(new TouchEvent(cancel?'touchcancel':'touchend',{bubbles:true,cancelable:true,touches:[],changedTouches:[end]}));
}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 try{
 const compact=matchMedia('(max-width:1100px)').matches;
 let sheet=await open();
 if(!compact){await gesture(sheet);await wait(420);check('Desktop ignores touch dismissal',!!document.querySelector('dialog[open]'));document.querySelector('[data-primary-resume-close]').click();await wait(50);check('Desktop cross still closes',closed===1);}
 else{
 for(const [label,options] of [['Short drag',{dy:40}],['Upward scroll',{dy:-140}],['Slow downward scroll',{duration:550}],['Horizontal swipe',{dx:160,dy:30}],['Diagonal swipe',{dx:130,dy:140}],['Canceled touch',{cancel:true}],['Pinch zoom',{multi:true}]]){
  await gesture(sheet.querySelector('.overlay-body-copy'),options);await wait(80);check(label+' keeps Resume open',!!document.querySelector('dialog[open]')&&!document.querySelector('.is-closing'));
 }
 for(const [label,selector,position] of [['Header','.overlay-avatar','top'],['Contact link','.overlay-contact a','top'],['Body text','.overlay-job:nth-child(2) .overlay-body-copy','middle'],['Tags','.overlay-job:nth-child(2) .overlay-tag','middle'],['Artwork','.overlay-resume-art','bottom']]){
  if(!document.querySelector('dialog'))sheet=await open();
  const scroll=document.querySelector('dialog');scroll.scrollTop=position==='top'?0:position==='bottom'?scroll.scrollHeight:scroll.scrollHeight/2;
  const before=closed;
  await gesture(sheet.querySelector(selector),{pointerCancel:true});await wait(60);
  check(label+' swipe starts the existing curtain',!!scroll.classList.contains('is-closing'),{scrollTop:scroll.scrollTop});
  await wait(400);check(label+' swipe dismisses once',!document.querySelector('dialog')&&closed===before+1);
 }
 sheet=await open(true);const scroll=document.querySelector('.test-scroll');scroll.scrollTop=scroll.scrollHeight/2;
 const before=closed;await gesture(sheet.querySelector('.overlay-body-copy'),{pointerCancel:true});await wait(60);check('Inline Resume starts curtain',!!document.querySelector('.overlay-resume--dismissing'));
 await wait(400);check('Inline Resume dismisses once',!document.querySelector('.overlay-resume')&&closed===before+1);
 sheet=await open();document.querySelector('[data-primary-resume-close]').click();await wait(420);check('Cross remains available',!document.querySelector('dialog'));
 }
 document.querySelector('#run').textContent='PASS: '+rows.length+' checks';
 }catch(error){document.querySelector('#run').textContent='FAIL: '+error.message;}
};
render();
</script></body></html>
